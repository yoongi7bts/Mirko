<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Mirko David</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: #f1e7d0;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        #inicio {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .estrella {
            font-size: 42px;
            color: #d8c28f;
            animation: brillo 2s infinite alternate;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin: 15px 0 10px;
        }

        .subtitulo {
            color: #bdb5a5;
            font-size: 16px;
            margin-bottom: 30px;
        }

        button {
            background: transparent;
            color: #f1e7d0;
            border: 1px solid #c9b58a;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-family: Georgia, serif;
            cursor: pointer;
            transition: 0.4s;
        }

        button:active {
            transform: scale(0.94);
        }

        #contenido {
            display: none;
            min-height: 100vh;
            text-align: center;
            padding: 70px 10px;
        }

        .titulo {
            font-size: 30px;
            font-weight: normal;
            animation: aparecer 1.5s ease;
        }

        .frase-intro {
            color: #bdb5a5;
            margin-top: 10px;
            margin-bottom: 45px;
        }

        .corazon {
            width: 100%;
            max-width: 390px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            perspective: 900px;
        }

        .foto {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 7px;
            overflow: hidden;
            background: #171717;
            border: 1px solid #8d7950;
            box-shadow:
                0 8px 15px rgba(0,0,0,0.6),
                0 0 10px rgba(201,181,138,0.12);

            transform-style: preserve-3d;
            animation: flotar 4s ease-in-out infinite;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .foto:hover {
            transform: translateZ(30px) rotateY(8deg) rotateX(5deg);
            box-shadow:
                0 15px 25px rgba(0,0,0,0.8),
                0 0 18px rgba(201,181,138,0.25);
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .vacio {
            visibility: hidden;
        }

        .frase {
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1;
            color: #d8c28f;
            font-size: 10px;
            line-height: 1.2;
            padding: 4px;
            text-align: center;
        }

        .carta {
            max-width: 650px;
            margin: 70px auto 0;
            padding: 35px 25px;
            border-top: 1px solid #6f6044;
            border-bottom: 1px solid #6f6044;
            animation: aparecer 2s ease;
        }

        .carta h2 {
            font-weight: normal;
            font-size: 25px;
            margin-bottom: 25px;
        }

        .carta p {
            color: #c8c0b2;
            font-size: 17px;
            line-height: 1.8;
        }

        .final {
            margin-top: 50px;
            color: #d8c28f;
            font-size: 24px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes brillo {
            from {
                opacity: 0.4;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-5px) rotate(0.5deg);
            }
        }
    </style>
</head>
