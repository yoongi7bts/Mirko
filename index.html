<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Mirko David</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: #f1e7d0;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        #inicio {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .estrella {
            font-size: 42px;
            color: #d8c28f;
            animation: brillo 2s infinite alternate;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin: 15px 0 10px;
        }

        .subtitulo {
            color: #bdb5a5;
            font-size: 16px;
            margin-bottom: 30px;
        }

        button {
            background: transparent;
            color: #f1e7d0;
            border: 1px solid #c9b58a;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.94);
        }

        #contenido {
            display: none;
            min-height: 100vh;
            text-align: center;
            padding: 70px 10px;
        }

        .titulo {
            font-size: 30px;
            font-weight: normal;
        }

        .frase-intro {
            color: #bdb5a5;
            margin-top: 10px;
            margin-bottom: 45px;
        }

        /* CORAZÓN */

        .corazon {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            align-items: center;
        }

        .foto {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            background: #171717;
            border: 1px solid #8d7950;

            box-shadow:
                0 8px 15px rgba(0,0,0,0.6),
                0 0 10px rgba(201,181,138,0.12);

            animation: flotar 4s ease-in-out infinite;
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .vacio {
            visibility: hidden;
        }

        /* POSICIONES DEL CORAZÓN */

        .p1 { grid-column: 2; grid-row: 1; }
        .p2 { grid-column: 3; grid-row: 1; }

        .p3 { grid-column: 6; grid-row: 1; }
        .p4 { grid-column: 7; grid-row: 1; }

        .p5 { grid-column: 1; grid-row: 2; }
        .p6 { grid-column: 2; grid-row: 2; }
        .p7 { grid-column: 3; grid-row: 2; }
        .p8 { grid-column: 4; grid-row: 2; }
        .p9 { grid-column: 5; grid-row: 2; }
        .p10 { grid-column: 6; grid-row: 2; }
        .p11 { grid-column: 7; grid-row: 2; }

        .p12 { grid-column: 8; grid-row: 2; }

        .p13 {
            grid-column: 4 / span 2;
            grid-row: 3;
        }

        .carta {
            max-width: 650px;
            margin: 70px auto 0;
            padding: 35px 25px;
            border-top: 1px solid #6f6044;
            border-bottom: 1px solid #6f6044;
        }

        .carta h2 {
            font-weight: normal;
            font-size: 25px;
            margin-bottom: 25px;
        }

        .carta p {
            color: #c8c0b2;
            font-size: 17px;
            line-height: 1.8;
        }

        .final {
            margin-top: 50px;
            color: #d8c28f;
            font-size: 24px;
        }

        @keyframes brillo {
            from {
                opacity: 0.4;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

    </style>
</head>
