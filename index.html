<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mirko David</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 50% 20%, #292216 0%, #0b0b0b 45%, #050505 100%);
    color: #f1e7d0;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

/* PARTICULAS */

.particulas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.particula {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #d8c28f;
    border-radius: 50%;
    opacity: 0;
    animation: subir 7s linear infinite;
}

.particula:nth-child(1) { left: 10%; animation-delay: 0s; }
.particula:nth-child(2) { left: 25%; animation-delay: 2s; }
.particula:nth-child(3) { left: 40%; animation-delay: 4s; }
.particula:nth-child(4) { left: 55%; animation-delay: 1s; }
.particula:nth-child(5) { left: 70%; animation-delay: 3s; }
.particula:nth-child(6) { left: 85%; animation-delay: 5s; }
.particula:nth-child(7) { left: 50%; animation-delay: 6s; }

@keyframes subir {
    0% {
        transform: translateY(110vh) scale(.4);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    80% {
        opacity: .5;
    }

    100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
    }
}

/* INICIO */

#inicio {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.estrella {
    color: #d8c28f;
    font-size: 45px;
    animation: brillo 2s infinite alternate;
    text-shadow: 0 0 18px rgba(216,194,143,.5);
}

h1 {
    font-size: 32px;
    font-weight: normal;
    margin: 18px 0 10px;
}

.subtitulo {
    color: #bdb5a5;
    font-size: 16px;
    margin-bottom: 32px;
}

button {
    background: rgba(20,20,20,.6);
    color: #f1e7d0;
    border: 1px solid #c9b58a;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-family: Georgia, serif;
    box-shadow: 0 0 20px rgba(201,181,138,.12);
    transition: .3s;
}

button:active {
    transform: scale(.92);
}

/* CONTENIDO */

#contenido {
    display: none;
    position: relative;
    z-index: 2;
    min-height: 100vh;
    text-align: center;
    padding: 65px 12px;
}

.titulo {
    font-size: 30px;
    animation: aparecer 1.5s ease;
}

.frase-intro {
    color: #bdb5a5;
    margin: 10px auto 45px;
    animation: aparecer 2s ease;
}

/* FOTOS 3D */

.galeria {
    width: min(94vw, 430px);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    perspective: 1000px;
}

.foto {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: #171717;
    border: 1px solid #8d7950;

    box-shadow:
        0 10px 20px rgba(0,0,0,.7),
        0 0 15px rgba(201,181,138,.12);

    transform:
        rotateX(var(--rx, 0deg))
        rotateY(var(--ry, 0deg))
        translateZ(var(--tz, 0px));

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    animation: entrada .8s ease both;
}

.foto:active {
    transform: scale(.94) translateZ(35px);
    box-shadow:
        0 15px 30px rgba(0,0,0,.9),
        0 0 25px rgba(216,194,143,.3);
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Cada foto aparece con un pequeño retraso */

.foto:nth-child(1) { animation-delay: .05s; }
.foto:nth-child(2) { animation-delay: .12s; }
.foto:nth-child(3) { animation-delay: .19s; }
.foto:nth-child(4) { animation-delay: .26s; }
.foto:nth-child(5) { animation-delay: .33s; }
.foto:nth-child(6) { animation-delay: .40s; }
.foto:nth-child(7) { animation-delay: .47s; }
.foto:nth-child(8) { animation-delay: .54s; }
.foto:nth-child(9) { animation-delay: .61s; }
.foto:nth-child(10) { animation-delay: .68s; }
.foto:nth-child(11) { animation-delay: .75s; }
.foto:nth-child(12) { animation-delay: .82s; }
.foto:nth-child(13) { animation-delay: .89s; }

@keyframes entrada {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.7) rotateX(20deg);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* MENSAJE */

.carta {
    max-width: 650px;
    margin: 70px auto 0;
    padding: 35px 25px;
    border-top: 1px solid #6f6044;
    border-bottom: 1px solid #6f6044;
    animation: aparecer 2s ease;
}

.carta h2 {
    font-weight: normal;
    font-size: 25px;
    margin-bottom: 25px;
}

.carta p {
    color: #c8c0b2;
    font-size: 17px;
    line-height: 1.8;
}

.final {
    margin-top: 45px;
    color: #d8c28f;
    font-size: 28px;
    animation: brillo 2s infinite alternate;
}

/* ANIMACIONES */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes brillo {
    from {
        opacity: .4;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1.1);
    }
}

/* CELULAR */

@media (max-width: 430px) {

    h1 {
        font-size: 28px;
    }

    .galeria {
        width: 94vw;
        gap: 6px;
    }

    .foto {
        border-radius: 8px;
    }

}
</style>
</head>

<body>

<!-- LUCES -->

<div class="particulas">

    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
</div>


<!-- INICIO -->

<section id="inicio">

    <div class="estrella">✦</div>

<!-- CONTENIDO -->

<section id="contenido">

    <p class="frase-intro">

    <div class="galeria">

        <div class="foto">

        <div class="foto">

        <div class="foto">

        <div class="foto">

    <div class="carta">

<script>

/* ENTRAR */

function comenzar() {

    document.getElementById("inicio").style.display = "none";

    document.getElementById("contenido").style.display = "block";

}


/* EFECTO 3D CON EL MOVIMIENTO DEL DEDO */

const fotos = document.querySelectorAll(".foto");

fotos.forEach(function(foto) {

    foto.addEventListener("touchmove", function(e) {

        const touch = e.touches[0];

        const rect = foto.getBoundingClientRect();

        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;

        const centroX = rect.width / 2;
        const centroY = rect.height / 2;

        const rotacionY = (x - centroX) / 12;
        const rotacionX = -(y - centroY) / 12;

        foto.style.setProperty("--rx", rotacionX + "deg");
        foto.style.setProperty("--ry", rotacionY + "deg");
        foto.style.setProperty("--tz", "20px");

    });

    foto.addEventListener("touchend", function() {

        foto.style.setProperty("--rx", "0deg");
        foto.style.setProperty("--ry", "0deg");
        foto.style.setProperty("--tz", "0px");

    });

});

</script>

</body>
