<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mirko David</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#05030a;
    color:white;
    font-family:Georgia,serif;
}

/* =========================
   FONDO GALAXIA
========================= */

#universo{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 45%,
        rgba(130,35,90,.35) 0%,
        rgba(35,10,35,.25) 25%,
        rgba(5,3,10,1) 70%);
}

.nebulosa{
    position:absolute;
    width:70vw;
    height:70vw;
    max-width:650px;
    max-height:650px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle,
        rgba(255,100,170,.14),
        rgba(120,40,180,.07) 35%,
        transparent 70%);
    filter:blur(25px);
    animation:respirar 7s ease-in-out infinite alternate;
}

@keyframes respirar{
    from{
        transform:translate(-50%,-50%) scale(.9);
        opacity:.65;
    }
    to{
        transform:translate(-50%,-50%) scale(1.12);
        opacity:1;
    }
}

.estrella{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px white;
    animation:flotar linear infinite;
}

@keyframes flotar{
    0%{
        transform:translateY(110vh) scale(.3);
        opacity:0;
    }
    15%{opacity:.8;}
    80%{opacity:.8;}
    100%{
        transform:translateY(-10vh) scale(1);
        opacity:0;
    }
}
