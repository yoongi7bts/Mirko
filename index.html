<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mirko David</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #f1e7d0;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

/* PANTALLA INICIAL */

#inicio {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.estrella {
    color: #d8c28f;
    font-size: 45px;
    text-shadow: 0 0 20px #d8c28f;
    animation: brillo 2s infinite alternate;
}

h1 {
    font-size: 32px;
    font-weight: normal;
    margin: 18px 0 10px;
}

.subtitulo {
    color: #bdb5a5;
    margin-bottom: 30px;
}

button {
    background: transparent;
    color: #f1e7d0;
    border: 1px solid #c9b58a;
    padding: 14px 28px;
    border-radius: 30px;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
}

/* CONTENIDO */

#contenido {
    display: none;
    min-height: 100vh;
    text-align: center;
    padding: 65px 12px;
}

.titulo {
    font-size: 30px;
    font-weight: normal;
}

.frase-intro {
    color: #bdb5a5;
    margin-bottom: 40px;
}

/* LUCES */

.luces {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.luz {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #d8c28f;
    animation: flotar 6s linear infinite;
}

.luz:nth-child(1) { left: 10%; animation-delay: 0s; }
.luz:nth-child(2) { left: 25%; animation-delay: 2s; }
.luz:nth-child(3) { left: 40%; animation-delay: 4s; }
.luz:nth-child(4) { left: 60%; animation-delay: 1s; }
.luz:nth-child(5) { left: 75%; animation-delay: 3s; }
.luz:nth-child(6) { left: 90%; animation-delay: 5s; }

@keyframes flotar {
    from {
        top: 100%;
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    to {
        top: -10%;
        opacity: 0;
    }
}

/* GALERÍA */

.galeria {
    width: 94%;
    max-width: 430px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;

    perspective: 900px;
}

.foto {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 9px;
    border: 1px solid #8d7950;
    background: #151515;

    box-shadow:
        0 8px 18px rgba(0,0,0,.7),
        0 0 12px rgba(216,194,143,.15);

    transition: transform .25s ease;
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* EFECTO 3D */

.foto:active {
    transform: scale(.93) rotateX(5deg) rotateY(8deg);
}

/* MENSAJE */

.carta {
    max-width: 650px;
    margin: 65px auto 0;
    padding: 30px 20px;
    border-top: 1px solid #6f6044;
    border-bottom: 1px solid #6f6044;
}

.carta h2 {
    font-size: 25px;
    font-weight: normal;
}

.carta p {
    color: #c8c0b2;
    font-size: 17px;
    line-height: 1.8;
}

.final {
    color: #d8c28f;
    font-size: 28px;
    margin-top: 40px;
}

@keyframes brillo {
    from {
        opacity: .4;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1.1);
    }
}

/* CELULAR */

@media (max-width: 430px) {
    h1 {
        font-size: 28px;
    }

    .titulo {
        font-size: 27px;
    }

    .galeria {
        gap: 5px;
    }
}
</style>
</head>


<body>

    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
