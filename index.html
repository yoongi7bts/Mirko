<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mirko David ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at center, #3a1825 0%, #180b13 45%, #080509 100%);
    color:white;
    font-family:Georgia, serif;
    overflow-x:hidden;
}

/* ================= INICIO ================= */

#inicio{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    position:relative;
    overflow:hidden;
}

#inicio h1{
    font-size:clamp(2.2rem,9vw,4rem);
    margin-bottom:15px;
    text-shadow:0 0 25px rgba(255,150,190,.7);
}

#inicio p{
    font-family:Arial,sans-serif;
    font-size:1rem;
    opacity:.85;
    margin-bottom:35px;
}

.boton{
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.08);
    color:white;
    padding:15px 30px;
    border-radius:40px;
    font-size:1rem;
    cursor:pointer;
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px rgba(255,100,160,.25);
    transition:.3s;
}

.boton:active{
    transform:scale(.94);
}

/* ================= CONTENIDO ================= */

#contenido{
    display:none;
    min-height:100vh;
    padding:45px 10px 80px;
    text-align:center;
}

.titulo{
    font-size:clamp(2rem,8vw,3.5rem);
    margin-bottom:8px;
    text-shadow:0 0 25px rgba(255,130,180,.6);
}

.subtitulo{
    font-family:Arial,sans-serif;
    opacity:.75;
    margin-bottom:20px;
}

/* ================= CORAZÓN ================= */

.corazon{
    width:min(94vw,520px);
    height:min(94vw,520px);
    margin:20px auto 45px;
    position:relative;

    perspective:1200px;
    transform-style:preserve-3d;

    filter:drop-shadow(0 0 30px rgba(255,50,130,.25));
}

/* Cada foto */

.foto{
    position:absolute;
    width:25%;
    aspect-ratio:1/1;

    transform-style:preserve-3d;
    transition:
        transform .12s ease-out,
        box-shadow .2s ease;

    border-radius:14px;
    overflow:hidden;

    border:3px solid rgba(255,255,255,.75);

    box-shadow:
        0 10px 25px rgba(0,0,0,.55),
        0 0 18px rgba(255,100,160,.2);

    background:#211018;
}

.foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;

    transform:translateZ(12px);
}
