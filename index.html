<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mirko David</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Georgia,serif;
    color:white;
    background:
        radial-gradient(circle at 50% 20%,#70485c 0%,#302038 28%,#11101d 65%,#05050b 100%);
}

/* =========================
   FONDO ANIMADO
========================= */

body::before{
    content:"";
    position:fixed;
    inset:-30%;
    z-index:-5;
    background:
        radial-gradient(circle,#e7b5c9 0 1px,transparent 2px),
        radial-gradient(circle,#fff 0 1px,transparent 2px);
    background-size:90px 90px,140px 140px;
    opacity:.35;
    animation:universo 30s linear infinite;
}

@keyframes universo{
    from{
        transform:translate(0,0) rotate(0deg);
    }
    to{
        transform:translate(80px,100px) rotate(8deg);
    }
}

/* =========================
   PANTALLA INICIAL
========================= */

#inicio{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    position:relative;
    overflow:hidden;
}

#inicio h1{
    font-size:36px;
    margin:18px 0 12px;
    text-shadow:
        0 0 10px rgba(255,220,235,.8),
        0 0 30px rgba(255,150,190,.5);
    animation:aparecer 2s ease;
}

#inicio p{
    font-size:18px;
    opacity:.9;
    margin-bottom:30px;
    animation:aparecer 3s ease;
}
